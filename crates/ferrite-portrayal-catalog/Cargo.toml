[package]
name = "ferrite-portrayal-catalog"
version.workspace = true
edition.workspace = true
description = "S-100 Portrayal Catalogue XML parser"

[features]
default = ["parallel"]
# Parallel catalogue snapshot reads (rayon); off: sequential, identical result.
parallel = ["ferrite-kernel/parallel"]

[dependencies]
quick-xml.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

ferrite-kernel.workspace = true

roxmltree = "0.20"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
regexml = "0.2.2"

sha2.workspace = true

# wasm32-unknown-unknown: regexml -> ahash -> getrandom 0.3 needs the JS
# (crypto.getRandomValues) backend there. Native targets are unaffected.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
