[package]
name = "ferrite-lua"
version.workspace = true
edition.workspace = true
description = "Lua integration for S-100 portrayal rules"

[features]
default = ["lua54"]
lua54 = ["ferrite-lua-runtime/lua54"]
lua55 = ["ferrite-lua-runtime/lua55"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Lua runtime
ferrite-lua-runtime = { path = "../ferrite-lua-runtime", default-features = false }

# Internal crates
ferrite-s100-core = { workspace = true }
ferrite-feature-catalog = { workspace = true }
ferrite-portrayal-catalog = { workspace = true }
ferrite-render = { workspace = true }

ferrite-kernel.workspace = true
