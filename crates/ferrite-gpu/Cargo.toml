[package]
name = "ferrite-gpu"
version.workspace = true
edition.workspace = true
description = "wgpu renderer for S-100 charts, independent of windowing and GUI toolkits"

[features]
# Typed S-102 raster materials (`S102RasterMaterial`); the signature backend
# of ferrite-s102 comes from the dependents (ferrite-cli/-wasm select it).
s102-material = ["dep:ferrite-s102"]
# The viewer's selection: S-102 materials with the OpenSSL backend.
s102-portrayal = ["s102-material", "ferrite-s102/crypto-openssl"]
lua54 = ["ferrite-s102?/lua54"]
lua55 = ["ferrite-s102?/lua55"]
# Test-only hooks used by ferrite-ui tests.
test-support = []

[dependencies]
ferrite-kernel.workspace = true
thiserror.workspace = true
tracing.workspace = true
rayon.workspace = true
rustc-hash.workspace = true

# Profiling
wgpu-profiler = "0.20"

# Graphics
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
image.workspace = true
lyon_tessellation = "=1.0.20"
earcutr.workspace = true  # Polygon triangulation
resvg.workspace = true  # SVG rendering

# Chart text: shapes, galleys and font definitions. Layout contexts and atlas
# uploads are supplied by the host through `ChartFontContext`.
ab_glyph = "=0.2.32"
epaint.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Internal crates
ferrite-render = { workspace = true, features = ["parallel"] }
ferrite-portrayal-catalog = { workspace = true, features = ["parallel"] }
serde.workspace = true

# Typed S102 material owner; preserve workspace-selected Lua backend.
ferrite-s102 = { path = "../ferrite-s102", default-features = false, optional = true }

# Web: WebGPU (wgpu default) plus the WebGL2 fallback. Single-threaded wasm
# (no atomics) needs wgpu's Send/Sync opt-in for the renderer's shared state.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { workspace = true, features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }
