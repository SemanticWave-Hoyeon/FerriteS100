[package]
name = "ferrite-s102"
version.workspace = true
edition.workspace = true
description = "S-102 bathymetric surface product adapter"

[features]
default = ["lua54"]
lua54 = ["ferrite-lua/lua54"]
lua55 = ["ferrite-lua/lua55"]

[dependencies]
hdf5 = { package = "hdf5-metno", version = "=0.14.1", features = ["static", "zlib"] }
hdf5_sys = { package = "hdf5-metno-sys", version = "=0.12.4" }
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
ferrite-render.workspace = true
ferrite-kernel.workspace = true
ferrite-lua.workspace = true
ferrite-portrayal-catalog.workspace = true

ferrite-interoperability.workspace = true

ferrite-security.workspace = true
chrono.workspace = true
roxmltree = "=0.20.0"

[dev-dependencies]
base64 = "=0.22.1"
openssl = { version = "0.10", features = ["vendored"] }
tempfile = "3"
