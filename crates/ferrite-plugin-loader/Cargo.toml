[package]
name = "ferrite-plugin-loader"
version.workspace = true
edition.workspace = true
description = "Plugin loader with security verification for FerriteS100"

[dependencies]
ferrite-plugin-api = { path = "../ferrite-plugin-api" }
abi_stable.workspace = true
libloading.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
