[package]
name = "ferrite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless S-100 chart tools (inspect, validate, render) on the ChartEngine facade, and the offscreen chart renderer they share with ferrite-capi"

[lib]
name = "ferrite_cli"
path = "src/lib.rs"

[[bin]]
name = "ferrite"
path = "src/main.rs"

[features]
default = ["lua54", "parallel", "s102-hdf5", "crypto-openssl", "s101", "s124", "s129", "s421"]
lua54 = ["ferrite-engine/lua54"]
lua55 = ["ferrite-engine/lua55"]
parallel = ["ferrite-engine/parallel"]
# S-102 bathymetry through the facade, drawn as the viewer draws it: the
# pure-Rust HDF5 reader (no C, builds for wasm32), and with s102-hdf5 also
# the HDF5 C library and Lua rule evaluation.
s102-pure = ["ferrite-engine/s102-pure", "ferrite-gpu/s102-material", "dep:ferrite-s102"]
s102-hdf5 = ["s102-pure", "ferrite-engine/s102-hdf5"]
crypto-openssl = ["ferrite-engine/crypto-openssl"]
crypto-rust = ["ferrite-engine/crypto-rust"]
# Product modules (S-101 base chart; S-124, S-129 GML overlays; S-421
# routes). Scenes are drawn with the first registered product's installed
# portrayal catalogue (S-101's when built); the S-101 cell set-up (reference
# scale, display-mode viewing groups, per-catalogue cell resources) only
# with s101.
s101 = ["ferrite-engine/s101", "dep:ferrite-s101"]
s124 = ["ferrite-engine/s124"]
s129 = ["ferrite-engine/s129"]
s421 = ["ferrite-engine/s421"]

[dependencies]
anyhow.workspace = true
image.workspace = true
pollster.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

ferrite-engine.workspace = true
ferrite-gpu.workspace = true
ferrite-kernel.workspace = true
ferrite-part9a.workspace = true
ferrite-portrayal-catalog.workspace = true
ferrite-product-api = { path = "../ferrite-product-api" }
ferrite-render.workspace = true
ferrite-s101 = { workspace = true, optional = true }
# The S-102 renderer extension's payload (raster tiles).
ferrite-s102 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
image.workspace = true
