[package]
name = "ferrite-s421"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S-421 route product: bounded published/CDV GML subset reader, route input capture, product layer (route overlay renderer extension) and the native route controller and editor"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow.workspace = true
ferrite-kernel = { path = "../ferrite-kernel" }
# Product interface: adapter, layer, data source, route overlay extension.
ferrite-product-api = { path = "../ferrite-product-api" }
serde = { workspace = true }
serde_json = "1"
quick-xml = { workspace = true }
roxmltree = "=0.20.0"
sha2.workspace = true

# The plugin layer (route controller with the abi_stable plugin interface,
# loaded dynamically through libloading) and the viewer's route editor are
# native only; the product layer (`layer`) builds for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ferrite-plugin-api = { path = "../ferrite-plugin-api" }
abi_stable = "0.11"
tempfile = "3"

[features]
# Test-only access to captured route text (`CapturedRouteInput::xml`), used by
# the application's tests.
test-support = []

[dev-dependencies]
tempfile = "3"
walkdir.workspace = true
