<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrite S-100 Web</title>
<style>
  :root { --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #d6dae2; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --ink: #e6e9ef; --muted: #98a1b3; --line: #2d333d; --accent: #58a6ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  #drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); cursor: pointer; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  #status { color: var(--muted); white-space: pre-wrap; margin-top: 8px; }
  ul { margin: 0; padding-left: 16px; }
  li { margin: 2px 0; }
  .issue-error { color: #d1242f; }
  table { border-collapse: collapse; width: 100%; }
  td { border-top: 1px solid var(--line); padding: 2px 4px; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 40%; }
  main { position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #hud { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--panel) 85%, transparent);
    padding: 2px 8px; border-radius: 4px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<aside>
  <h1>Ferrite S-100 Web</h1>
  <div style="color:var(--muted)">ChartEngine in WebAssembly, drawn by ferrite-gpu.</div>
  <h2>Data</h2>
  <div id="drop">Drop S-101 cells, S-102 HDF5, S-124 / S-129 GML and<br>optional <code>.ferrite_pre_*</code> payloads here
    <div class="row" style="justify-content:center">
      <label><input id="files" type="file" multiple hidden><button id="pick-files" type="button">Choose files</button></label>
      <button id="samples" type="button">Load samples</button>
    </div>
  </div>
  <div class="row">
    <label>Palette <select id="palette"></select></label>
    <button id="fit" type="button">Fit</button>
  </div>
  <div class="row">
    <label>S-101 <select id="portrayal">
      <option value="auto">Auto</option><option value="lua">Lua (in browser)</option><option value="precomputed">Precomputed</option>
    </select></label>
  </div>
  <div class="row">
    <label>Backend <select id="backend">
      <option value="auto">Auto</option><option value="webgpu">WebGPU</option><option value="webgl2">WebGL2</option>
    </select></label>
    <label>Engine <select id="thread">
      <option value="auto">Worker (auto)</option><option value="on">Worker</option><option value="off">Main thread</option>
    </select></label>
  </div>
  <div class="row">
    <button id="clear-cache" type="button">Clear portrayal cache</button>
  </div>
  <div id="status">Loading…</div>
  <h2>Datasets</h2>
  <ul id="datasets"><li style="color:var(--muted)">None</li></ul>
  <h2>Picked features</h2>
  <div id="pick" style="color:var(--muted)">Click the chart.</div>
</aside>
<main>
  <canvas id="chart"></canvas>
  <div id="hud"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
