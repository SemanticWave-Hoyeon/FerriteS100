[package]
name = "ferrite-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S-100 chart engine: dataset discovery, opening, signatures, update chains, caches and product adapters, independent of windowing, GUI and GPU"

[features]
default = ["lua54", "parallel", "s102-hdf5", "crypto-openssl", "s124", "s129", "s421"]
# Threads and rayon: parallel cell loading, Lua portrayal workers, cache
# coding, suppression and coverage projection. Off: everything runs on the
# calling thread (sequential executor) with identical results.
parallel = ["ferrite-kernel/parallel", "ferrite-render/parallel", "ferrite-s101/parallel", "ferrite-portrayal-catalog/parallel"]
# mlua S-101 portrayal (needs lua54 or lua55, which select the interpreter).
# Off: S-101 cells are portrayed from precomputed per-cell instruction
# payloads in the cache store (`PortrayalSource::Precomputed`).
lua-native = ["ferrite-lua/native", "ferrite-s102?/lua-native"]
lua54 = ["lua-native", "ferrite-lua/lua54", "ferrite-s101/lua54", "ferrite-s102?/lua54"]
lua55 = ["lua-native", "ferrite-lua/lua55", "ferrite-s101/lua55", "ferrite-s102?/lua55"]
# S-102 bathymetry with the pure-Rust HDF5 reader only (no C library;
# builds for wasm32). Without lua-native the PC rule's instructions come
# from the cache store (precomputed). Off (with s102-hdf5): S-102 inputs
# are reported as unsupported.
s102-pure = ["dep:ferrite-s102"]
# S-102 with the HDF5 C library as the reader for local paths (the viewer's
# native reader) and Lua rule evaluation; implies s102-pure.
s102-hdf5 = ["s102-pure", "ferrite-s102/hdf5", "lua-native"]
# Signature backends of ferrite-security; at least one is required.
# OpenSSL (C, vendored) is the default; crypto-rust alone builds without
# OpenSSL, with both OpenSSL stays the default (`CryptoBackend::Rust` selectable).
crypto-openssl = ["ferrite-security/crypto-openssl"]
crypto-rust = ["ferrite-security/crypto-rust"]
# Product modules (docs/ENGINE_DESIGN.md, "제품 모듈화"). Off: the product's
# datasets are not recognised (not discovered, sniffed or opened) and its
# catalogues are not loaded.
s124 = ["dep:ferrite-s124"]
s129 = ["dep:ferrite-s129"]
# S-421 routes (ferrite-s421 product layer): discovery, capture and the
# route store of ChartEngine.
s421 = ["dep:ferrite-s421"]
# Test-only helpers used by the application's own tests.
test-support = []

[dependencies]
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
quick-xml.workspace = true
roxmltree = "=0.20.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
tracing.workspace = true
walkdir.workspace = true

ferrite-feature-catalog.workspace = true
ferrite-interoperability.workspace = true
ferrite-iso8211.workspace = true
ferrite-kernel.workspace = true
ferrite-lua.workspace = true
ferrite-portrayal-catalog.workspace = true
ferrite-product-api = { path = "../ferrite-product-api" }
ferrite-render.workspace = true
ferrite-s100-core.workspace = true
ferrite-s100-gml = { path = "../ferrite-s100-gml" }
ferrite-s101.workspace = true
ferrite-s102 = { workspace = true, optional = true }
ferrite-s124 = { path = "../ferrite-s124", optional = true }
ferrite-s129 = { path = "../ferrite-s129", optional = true }
# The product layer builds for wasm32; the native-only plugin layer of the
# crate stays behind its own target gating.
ferrite-s421 = { path = "../ferrite-s421", optional = true }
ferrite-security.workspace = true
ferrite-xslt = { path = "../ferrite-xslt" }

# ARMv8 SHA-256 instructions (runtime-detected) for the portrayal cache check,
# as the root package selects for the viewer: without it, builds of the engine
# alone (CLI, C ABI, examples) hash cache payloads in software.
[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Test-only actual ECDSA fixture; already used by ferrite-security.
openssl = { version = "0.10", features = ["vendored"] }
base64 = "=0.22.1"
