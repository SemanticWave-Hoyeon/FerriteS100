[package]
name = "ferrite-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S-100 chart engine: dataset discovery, opening, signatures, update chains, caches and product adapters, independent of windowing, GUI and GPU"

[features]
default = ["lua54", "parallel", "s102-hdf5", "crypto-openssl"]
# Threads and rayon: parallel cell loading, Lua portrayal workers, cache
# coding, suppression and coverage projection. Off: everything runs on the
# calling thread (sequential executor) with identical results.
parallel = ["ferrite-kernel/parallel", "ferrite-render/parallel", "ferrite-s101/parallel", "ferrite-portrayal-catalog/parallel"]
# mlua S-101 portrayal (needs lua54 or lua55, which select the interpreter).
# Off: S-101 cells are portrayed from precomputed per-cell instruction
# payloads in the cache store (`PortrayalSource::Precomputed`).
lua-native = ["ferrite-lua/native"]
lua54 = ["lua-native", "ferrite-lua/lua54", "ferrite-s101/lua54", "ferrite-s102?/lua54"]
lua55 = ["lua-native", "ferrite-lua/lua55", "ferrite-s101/lua55", "ferrite-s102?/lua55"]
# S-102 bathymetry (HDF5, C library; its portrayal needs lua-native). Off:
# S-102 inputs are reported as unsupported.
s102-hdf5 = ["dep:ferrite-s102", "lua-native"]
# Signature backends of ferrite-security; at least one is required.
# OpenSSL (C, vendored) is the default; crypto-rust alone builds without
# OpenSSL, with both OpenSSL stays the default (`CryptoBackend::Rust` selectable).
crypto-openssl = ["ferrite-security/crypto-openssl"]
crypto-rust = ["ferrite-security/crypto-rust"]
# Test-only helpers used by the application's own tests.
test-support = []

[dependencies]
anyhow.workspace = true
bincode.workspace = true
chrono.workspace = true
quick-xml.workspace = true
roxmltree = "=0.20.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
tracing.workspace = true
walkdir.workspace = true

ferrite-feature-catalog.workspace = true
ferrite-interoperability.workspace = true
ferrite-iso8211.workspace = true
ferrite-kernel.workspace = true
ferrite-lua.workspace = true
ferrite-portrayal-catalog.workspace = true
ferrite-render.workspace = true
ferrite-s100-core.workspace = true
ferrite-s100-gml = { path = "../ferrite-s100-gml" }
ferrite-s101.workspace = true
ferrite-s102 = { workspace = true, optional = true }
ferrite-security.workspace = true
ferrite-xslt = { path = "../ferrite-xslt" }

# S-421 route input reads the profile through ferrite-s421, whose plugin layer
# (abi_stable/libloading) does not build for wasm32; the web build mirrors the
# two items it needs in `s421_dataset_input` (S-421 input is native-only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ferrite-s421 = { path = "../ferrite-s421" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Test-only actual ECDSA fixture; already used by ferrite-security.
openssl = { version = "0.10", features = ["vendored"] }
base64 = "=0.22.1"
