[package]
name = "s101-explorer"
version = "0.1.0"
edition = "2021"
description = "FerriteS100 plugin: in-process index browser for S-101 ENC data using HostApi chart_* queries."
authors = ["FerriteS100 Team"]

# Standalone — same pattern as route-plugin. cdylib must not be a workspace
# member or rustc complains about duplicate crate types.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ferrite-plugin-api = { path = "../../crates/ferrite-plugin-api" }
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
