[package]
name = "route-plugin"
version = "0.1.0"
edition = "2021"
description = "S-421 Route Planning Plugin for FerriteS100"
authors = ["FerriteS100 Team"]

# Standalone package (not part of parent workspace)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ferrite-plugin-api = { path = "../../crates/ferrite-plugin-api" }
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Note: ASLR, DEP, CFG are enabled via build.rs
